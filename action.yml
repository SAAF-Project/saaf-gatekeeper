name: SAAF Gatekeeper
description: Reports matched secret patterns in Git history and checks indexed .env handling; inspection errors fail closed.
inputs:
  path:
    description: Repository to check. Must be a full clone (actions/checkout with fetch-depth 0).
    default: .
runs:
  using: composite
  steps:
    - name: Install gitleaks 8.30.1
      shell: bash
      env:
        GATEKEEPER_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        bash "$GATEKEEPER_ACTION_PATH/scripts/install-gitleaks.sh" "$RUNNER_TEMP/saaf-gitleaks-bin"
        echo "$RUNNER_TEMP/saaf-gitleaks-bin" >> "$GITHUB_PATH"
    - name: Scan
      shell: bash
      env:
        GATEKEEPER_PATH: ${{ inputs.path }}
      run: '"$GITHUB_ACTION_PATH/gatekeeper.sh" "$GATEKEEPER_PATH"'
