name: SAAF Gatekeeper
description: Fails the build when a secret is in any commit on any branch, or when a .env file can be committed.
inputs:
  path:
    description: Repository to check. Must be a full clone (actions/checkout with fetch-depth 0).
    default: .
runs:
  using: composite
  steps:
    - name: Install gitleaks 8.30.1
      shell: bash
      run: |
        curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - name: Scan
      shell: bash
      env:
        GATEKEEPER_PATH: ${{ inputs.path }}
      run: '"$GITHUB_ACTION_PATH/gatekeeper.sh" "$GATEKEEPER_PATH"'
